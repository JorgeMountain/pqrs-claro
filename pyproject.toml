[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pqrs-claro"
version = "0.1.0"
description = "Asistente PQRS con fuentes, revisión humana y generación de oficios trazables."
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx==0.28.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "python-multipart==0.0.32",
  "pydantic==2.13.5",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==2.54.0",
  "pymupdf==1.28.2",
  "python-dotenv==1.2.3",
  "python-docx==1.2.0",
  "pillow==12.3.0",
  "fastembed==0.8.0",
  "numpy==2.2.6",
  "pywin32==310; sys_platform == 'win32'",
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff>=0.12,<1", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pqrs_claro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
