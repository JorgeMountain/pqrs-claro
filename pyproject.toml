[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pqrs-claro"
version = "0.1.0"
description = "Primera entrega: comprender una petición con fuentes de texto verificables."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "python-multipart==0.0.32",
  "pydantic==2.13.5",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==2.54.0",
  "pymupdf==1.28.2",
  "python-dotenv==1.2.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff>=0.12,<1", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pqrs_claro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
