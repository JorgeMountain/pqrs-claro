name: Verificación de FIAGA

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fiaga-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Arranque de FIAGA y pruebas Python
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.1'
      - name: Instalar las dependencias de Python 3.12
        run: uv sync --locked --python 3.12
      - name: Comprobar que el servidor abre la recepción y la bandeja
        run: uv run --no-sync python scripts/check-fiaga-startup.py
      - name: Comprobar el código con Ruff
        run: uv run --no-sync ruff check src tests scripts/check-fiaga-startup.py
      - name: Descargar el modelo público de la prueba semántica
        run: uv run --no-sync python -m pqrs_claro.source_semantic --download
      - name: Ejecutar toda la suite de Python
        env:
          HF_HUB_OFFLINE: '1'
        run: uv run --no-sync python -m pytest -q -ra

  frontend:
    name: JavaScript y recorridos en Chrome
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Ejecutar toda la suite de JavaScript
        run: node --test tests/*.mjs
      - name: Verificar la aprobación del oficio
        run: node --experimental-vm-modules scripts/check_review_approval.mjs
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.1'
      - name: Instalar las dependencias de navegador
        run: uv sync --locked --python 3.12 --group browser
      - name: Ejecutar todos los recorridos de navegador con Chrome
        run: uv run --no-sync python -m pytest -q -ra -o 'python_files=check_*_browser.py' tests
